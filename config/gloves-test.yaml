camera:
  source: "0"
  width: 1280
  height: 720
  min_fps: 10
  reconnect_delay_sec: 3

model:
  path: "models/tanishjain/best.pt"
  confidence: 0.20   # mais sensível para luvas
  device: ""

# Classes do modelo Tanishjain (sem Person, sem violações)
classes:
  person: []
  helmet: ["helmet"]
  vest: ["Vest"]
  gloves: ["Gloves"]
  goggles: ["goggles"]
  mask: ["mask"]
  boots: ["safety_shoe"]
  violation: {}

tracking:
  enabled: false  # modelo sem Person → tracking não faz sentido

rules:
  required_ppe: ["gloves"]
  confirmation_frames: 5

display:
  show_confidence: true
  alert_color: [0, 0, 255]
  person_color: [0, 255, 0]
  ppe_color: [0, 200, 255]
  window_name: "Gloves Detection"

evidence:
  enabled: false
  output_dir: "evidence"
  save_on_alert: true
  save_video: false
  video_pre_seconds: 3
  video_post_seconds: 3
  video_fps: 10

storage:
  db_path: "data/occurrences.db"
  reports_dir: "data/reports"

dashboard:
  host: "0.0.0.0"
  port: 8080
  cameras_file: "config/cameras.yaml"
