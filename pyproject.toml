[project]
name = "ppe-detection"
version = "0.1.0"
description = "Detector de EPI em tempo real via câmera"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "lap>=0.5.12",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.20.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "openpyxl>=3.1.0",
    "fpdf2>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
]

[project.scripts]
ppe-detection = "ppe_detection.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spec(id): marca teste de aceitação rastreável à user story (ex: US-001)",
]
